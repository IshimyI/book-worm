name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book-worm-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: book-worm-test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx sequelize db:migrate --env test
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book-worm-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: book-worm-test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      ACCESS_TOKEN_SECRET: e2e-access-secret
      REFRESH_TOKEN_SECRET: e2e-refresh-secret
      JWT_SECRET: e2e-jwt-secret
      JWT_PASS: e2e-jwt-pass
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: server
      - run: npx sequelize db:migrate --env test
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: echo "VITE_TARGET=http://localhost:3000" > .env
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.STAGING_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDPgbIIsPJkCZPKxkwVdU8ySWpjvO6u6pJ/IggVbgo9B" >> ~/.ssh/known_hosts
      - name: Deploy server + client to staging
        run: |
          rsync -az --exclude node_modules --exclude .env server/ root@${{ secrets.STAGING_HOST }}:/var/www/mrbookworm-staging/server/
          rsync -az --delete client/dist/ root@${{ secrets.STAGING_HOST }}:/var/www/mrbookworm-staging/client/
      - name: Migrate + restart
        run: |
          ssh root@${{ secrets.STAGING_HOST }} '
            cd /var/www/mrbookworm-staging/server &&
            npm ci --omit=dev &&
            set -a && source .env && set +a &&
            npx sequelize db:migrate --env staging &&
            systemctl restart bookworm-staging.service
          '
