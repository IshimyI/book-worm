}
server {
    if ($host = www.mrbookworm.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mrbookworm.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mrbookworm.ru www.mrbookworm.ru;
    return 404; # managed by Certbot




}

server {
    if ($host = staging.mrbookworm.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name staging.mrbookworm.ru;
    return 404; # managed by Certbot


}